<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flect</title>
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%2313171c'/%3E%3Cpath d='M5.5 6.5 12 15.5l6.5-9' fill='none' stroke='%239d9cff' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M5 18.5h14' stroke='%23e2e6ea' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E" />
    <script>
      // Resolve the theme before first paint: a saved choice wins, otherwise follow the OS.
      (function () {
        var t = null;
        try { t = localStorage.getItem("flect-theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <script type="module" crossorigin src="/static/app.js"></script>
    <link rel="stylesheet" crossorigin href="/static/app.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
