[project]
name = "flect"
version = "0.1.0"
description = "Agentic CI/CD that protects production, powered by a local LLM"
requires-python = ">=3.12"
dependencies = ["fastapi==0.115.6", "uvicorn==0.32.1", "jsonschema==4.23.0"]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "httpx==0.27.2"]

[project.scripts]
flect = "flect.cli:main"

[tool.setuptools.packages.find]
include = ["flect*"]

[tool.setuptools.package-data]
flect = ["static/*", "db/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
